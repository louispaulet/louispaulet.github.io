  <rect x="628" y="536" width="56" height="56" fill="#ed4b4f"/>
  <circle cx="652" cy="558" r="10" fill="none" stroke="#0f1012" stroke-width="4"/>
  <path d="M660 566l9 9" stroke="#0f1012" stroke-width="4"/>

  <rect x="776" y="238" width="336" height="292" fill="#101114" stroke="#41434a" stroke-width="2"/>
  <text x="816" y="282" fill="#ed4b4f" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">DEPLOYMENT</text>
