  <text x="816" y="570" fill="#777c86" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1">NOT A FORK · JUST A HOST</text>

  <text x="72" y="728" fill="#777c86" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="2">LOUIS PAULET / 2026</text>
