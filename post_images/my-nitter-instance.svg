  <text x="128" y="314" fill="#f5f6f7" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Read the public web</text>
  <text x="128" y="380" fill="#f5f6f7" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">without the feed.</text>
  <text x="128" y="438" fill="#aeb2ba" font-family="Arial, Helvetica, sans-serif" font-size="22">A personal Nitter deployment at</text>
  <text x="128" y="476" fill="#f5f6f7" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">x.thefrenchartist.dev</text>

