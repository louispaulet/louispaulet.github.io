<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">My Nitter instance</title>
  <desc id="desc">A dark Nitter interface illustration with a search field and deployment notes.</desc>
  <rect width="1280" height="800" fill="#0f1012"/>
  <rect width="1280" height="92" fill="#1d1e21"/>
  <rect x="0" y="90" width="1280" height="2" fill="#35363a"/>
  <rect x="72" y="34" width="28" height="28" fill="#ed4b4f"/>
