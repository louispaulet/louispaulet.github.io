  <text x="1042" y="54" fill="#ed4b4f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">OPEN WEB</text>

  <rect x="72" y="168" width="1136" height="482" fill="#17181b" stroke="#37383d" stroke-width="2"/>
